spring.application.name=SpingMVC_usingSpringBoot
# ===============================
# SERVER CONFIGURATION
# ===============================

# Server port (default = 8080)
server.port=8080

# Context path (optional)
# http://localhost:8080/myapp/
server.servlet.context-path=/myapp


# ===============================
# JSP VIEW RESOLVER CONFIG
# ===============================

# Prefix: folder where JSP files are stored
spring.mvc.view.prefix=/WEB-INF/views/

# Suffix: JSP extension
spring.mvc.view.suffix=.jsp


# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================

# DB URL
spring.datasource.url=jdbc:mysql://localhost:3306/user_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

# DB username
spring.datasource.username=root

# DB password
spring.datasource.password=root

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL (pretty print)
spring.jpa.properties.hibernate.format_sql=true

# Auto schema update
# options: none | validate | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Dialect (MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# ===============================
# LOGGING CONFIG (OPTIONAL)
# ===============================

# Show SQL values (very useful for debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ===============================
# DEVTOOLS CONFIG (OPTIONAL)
# ===============================

# Enable automatic restart
spring.devtools.restart.enabled=true


# ===============================
# FILE UPLOAD (OPTIONAL)
# ===============================

# Enable file upload
spring.servlet.multipart.enabled=true

# Max file size
spring.servlet.multipart.max-file-size=10MB

# Max request size
spring.servlet.multipart.max-request-size=10MB


# ===============================
# CHARACTER ENCODING
# ===============================

# Force UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true